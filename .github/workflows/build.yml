name: Build APK
on:
  push: { branches: [ main ] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Restore keystore
        id: ks
        uses: actions/cache/restore@v4
        with: { path: 'android/app/vtomp3-release.jks', key: 'vtomp3-key-v1' }
      - name: Flutter create android (без перезаписи lib и pubspec)
        run: |
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            mkdir -p /tmp/keep
            cp pubspec.yaml /tmp/keep/pubspec.yaml
            cp -r lib /tmp/keep/lib
            flutter create --org com.videotomp3 --project-name video_to_mp3 --platforms android .
            cp /tmp/keep/pubspec.yaml pubspec.yaml
            rm -rf lib && cp -r /tmp/keep/lib lib
          fi
          rm -rf test
      - name: Make keystore
        run: |
          if [ ! -f android/app/vtomp3-release.jks ]; then
            keytool -genkeypair -v -keystore android/app/vtomp3-release.jks -storetype JKS -keyalg RSA -keysize 2048 -validity 10000 -alias vtomp3 -storepass vtomp3123 -keypass vtomp3123 -dname "CN=VideoToMp3"
          fi
          printf 'storePassword=vtomp3123\nkeyPassword=vtomp3123\nkeyAlias=vtomp3\nstoreFile=vtomp3-release.jks\n' > android/key.properties
      - name: Save keystore
        if: steps.ks.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with: { path: 'android/app/vtomp3-release.jks', key: 'vtomp3-key-v1' }
      - name: Patch android (manifest, app gradle)
        run: python3 tool/patch_android.py
      - name: Force compileSdk 36 for ALL plugins
        run: |
          mkdir -p ~/.gradle/init.d
          cp tool/force-compile-sdk.gradle ~/.gradle/init.d/force-compile-sdk.gradle
      - name: Ensure launcher icon exists
        run: |
          mkdir -p assets/icon
          if [ "$(head -c 8 assets/icon/icon.png 2>/dev/null | od -An -tx1 | tr -d ' \n')" != "89504e470d0a1a0a" ]; then
            echo "icon.png отсутствует или битая — генерирую"
            rm -f assets/icon/icon.png
            python3 tool/gen_icon.py assets/icon/icon.png
          fi
          ls -la assets/icon
      - name: Bump version
        run: |
          sed -i "s/^version: .*/version: 1.5.${{ github.run_number }}+${{ github.run_number }}/" pubspec.yaml
      - name: pub get
        run: flutter pub get
      - name: Generate launcher icon
        run: dart run flutter_launcher_icons || echo "::warning::flutter_launcher_icons не отработал, будет дефолтная иконка"
      - name: Build release APK
        run: flutter build apk --release --split-per-abi --target-platform android-arm64
      - name: Verify and name APK
        run: |
          set -e
          mkdir -p out
          APK=$(ls build/app/outputs/flutter-apk/*arm64-v8a*release*.apk | head -n 1)
          cp "$APK" "out/VideoToMp3-v${{ github.run_number }}.apk"
          cd out && sha256sum *.apk > SHA256SUMS.txt
          echo "VideoToMp3 — конвертер видео в MP3." > NOTES.md
      - uses: actions/upload-artifact@v4
        with: { name: 'VideoToMp3-apk', path: 'out/*.apk' }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.${{ github.run_number }}
          name: VideoToMp3 — сборка ${{ github.run_number }}
          body_path: out/NOTES.md
          files: |
            out/*.apk
            out/SHA256SUMS.txt
          make_latest: true
