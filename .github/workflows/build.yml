name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore keystore
        id: ks
        uses: actions/cache/restore@v4
        with:
          path: android/app/pulseagent-release.jks
          key: pulseagent-key-v1
      - name: Flutter create android (чистая генерация структуры Gradle + возврат наших файлов)
        run: |
          mkdir -p /tmp/keep
          cp pubspec.yaml /tmp/keep/pubspec.yaml
          cp -r lib /tmp/keep/lib
          cp -r android/app/src/main/kotlin /tmp/keep/kotlin
          cp -r android/app/src/main/res/xml /tmp/keep/xml
          rm -rf android
          flutter create --org com.pulseagent --project-name pulse_agent --platforms android .
          cp /tmp/keep/pubspec.yaml pubspec.yaml
          rm -rf lib && cp -r /tmp/keep/lib lib
          mkdir -p android/app/src/main/kotlin/com/pulseagent/app
          cp -r /tmp/keep/kotlin/com/pulseagent/app/* android/app/src/main/kotlin/com/pulseagent/app/
          mkdir -p android/app/src/main/res/xml
          cp -r /tmp/keep/xml/* android/app/src/main/res/xml/
          rm -rf android/app/src/main/kotlin/com/pulseagent/pulse_agent 2>/dev/null || true
          rm -rf test
      - name: Make keystore
        run: |
          if [ ! -f android/app/pulseagent-release.jks ]; then
            keytool -genkeypair -v -keystore android/app/pulseagent-release.jks -storetype JKS -keyalg RSA -keysize 2048 -validity 10000 -alias pulseagent -storepass pulse123 -keypass pulse123 -dname "CN=PulseAgent"
          fi
          printf 'storePassword=pulse123\nkeyPassword=pulse123\nkeyAlias=pulseagent\nstoreFile=pulseagent-release.jks\n' > android/key.properties
      - name: Save keystore
        if: steps.ks.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: android/app/pulseagent-release.jks
          key: pulseagent-key-v1
      - name: Patch android (manifest, services, compileSdk=36)
        run: python3 tool/patch_android.py
      - name: Force compileSdk 36 for ALL plugins
        run: |
          mkdir -p ~/.gradle/init.d
          cp tool/force-compile-sdk.gradle ~/.gradle/init.d/force-compile-sdk.gradle
      - name: Ensure launcher icon exists
        run: |
          mkdir -p assets/icon
          python3 tool/gen_icon.py assets/icon/icon.png
          ls -la assets/icon
      - name: Bump version
        run: |
          sed -i "s/^version: .*/version: 1.0.${{ github.run_number }}+${{ github.run_number }}/" pubspec.yaml
      - name: pub get
        run: flutter pub get
      - name: Generate launcher icon
        run: dart run flutter_launcher_icons || echo "::warning::flutter_launcher_icons skipped"
      - name: Build release APK
        env:
          OR_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "$OR_KEY" ]; then
            flutter build apk --release --split-per-abi --target-platform android-arm64 --dart-define=OPENROUTER_API_KEY="$OR_KEY"
          else
            flutter build apk --release --split-per-abi --target-platform android-arm64
          fi
      - name: Verify and name APK
        run: |
          set -e
          mkdir -p out
          APK=$(ls build/app/outputs/flutter-apk/*arm64-v8a*release*.apk | head -n 1)
          cp "$APK" "out/PulseAgent-v1.0.${{ github.run_number }}.apk"
          cd out && sha256sum *.apk > SHA256SUMS.txt
          printf '%s\n' \
            "PulseAgent v1.0 — Jarvis AI Android Control Agent:" \
            "- Управление экраном через AccessibilityService (чтение UI, тап, ввод текста, скролл, свайп)" \
            "- Системные действия: Будильники, Таймер, Звонки, SMS, Календарь, Напоминания, Фонарик, Громкость, Яркость, Wi-Fi, Камера, Музыка, Геолокация, Мессенджеры" \
            "- Бесплатные модели OpenRouter (openrouter/free, deepseek-r1:free, llama-3.3-70b:free, gemini-2.0-flash-exp:free) + удобный блок ручного ввода и подтверждения ключа прямо в приложении" \
            "- Нативный голосовой ввод (SpeechRecognizer) + голосовой ответ (TextToSpeech) + Быстрые команды + Автоматизации" \
            "- Безопасность: Подтверждение опасных действий, Чёрный список банков, Красная кнопка СТОП и остановка встряхиванием (Shake-to-Stop)" > NOTES.md
      - uses: actions/upload-artifact@v4
        with:
          name: PulseAgent-apk
          path: out/*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PulseAgent v1.0 — сборка ${{ github.run_number }}
          body_path: out/NOTES.md
          files: |
            out/*.apk
            out/SHA256SUMS.txt
          make_latest: true
