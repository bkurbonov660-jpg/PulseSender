name: video_to_mp3
description: "VideoToMp3 v2.0 — YouTube/TikTok/Instagram без водяного знака, MP3 с обложкой, обрезка и пакетная очередь"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  ffmpeg_kit_flutter_new: ^4.6.8
  flutter_foreground_task: ^8.1.0
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  just_audio: ^0.9.42
  open_filex: ^4.5.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.4
  file_picker: ^8.0.0
  http: ^1.2.2
  youtube_explode_dart: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 24

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
